name: Build macOS Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build Apple Silicon DMG
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate icons
        run: npm run icons

      - name: Build macOS arm64 release files
        run: npm run dist:mac:arm64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-pet-macos-arm64
          path: |
            dist/*.dmg
            dist/*.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
          body: |
            桌面寵物 macOS Apple Silicon 版本。

            適用於 M1 / M2 / M3 / M4 Mac。

            如果第一次打不開，請到「應用程式」右鍵點「桌面寵物」並選「打開」。如果仍被阻擋，請到「系統設定」→「隱私權與安全性」按「仍要打開」。
